apiVersion: v1
kind: Service

metadata:
  name: mongodb
  labels:
    {{- include "fittrack.labels" . | nindent 4 }}

spec:
  type: {{ .Values.mongodb.service.type }}

  selector:
    app: mongodb

  ports:
    - port: {{ .Values.mongodb.service.port }}
      targetPort: {{ .Values.mongodb.service.port }}
      protocol: TCP
