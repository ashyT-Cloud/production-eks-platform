{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
  name: {{ include "fittrack.fullname" . }}
  labels:
    {{- include "fittrack.labels" . | nindent 4 }}

  annotations:
    {{- range $key, $value := .Values.ingress.annotations }}
    {{ $key }}: {{ $value | quote }}
    {{- end }}

spec:
  ingressClassName: {{ .Values.ingress.className }}

  rules:
    - http:
        paths:

          - path: {{ .Values.ingress.frontend.path }}
            pathType: {{ .Values.ingress.frontend.pathType }}
            backend:
              service:
                name: {{ include "fittrack.fullname" . }}-frontend
                port:
                  number: {{ .Values.frontend.service.port }}

          - path: {{ .Values.ingress.backend.path }}
            pathType: {{ .Values.ingress.backend.pathType }}
            backend:
              service:
                name: {{ include "fittrack.fullname" . }}-backend
                port:
                  number: {{ .Values.backend.service.port }}

{{- end }}
