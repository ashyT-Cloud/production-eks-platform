apiVersion: apps/v1
kind: Deployment

metadata:
  name: mongodb
  labels:
    {{- include "fittrack.labels" . | nindent 4 }}

spec:
  replicas: {{ .Values.mongodb.replicaCount }}

  selector:
    matchLabels:
      app: mongodb

  template:
    metadata:
      labels:
        app: mongodb

    spec:
      containers:
        - name: mongodb

          image: "{{ .Values.mongodb.image.repository }}:{{ .Values.mongodb.image.tag }}"

          imagePullPolicy: {{ .Values.mongodb.image.pullPolicy }}

          ports:
            - containerPort: {{ .Values.mongodb.service.port }}

          env:
            - name: MONGO_INITDB_ROOT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: mongodb-secret
                  key: username

            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mongodb-secret
                  key: password

            - name: MONGO_INITDB_DATABASE
              valueFrom:
                configMapKeyRef:
                  name: fittrack-config
                  key: database
